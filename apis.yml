name: Pazpo
description: >-
  Pazpo was an Indonesian property-technology (proptech) marketplace that
  billed itself as the country's first property search engine ("Mesin Pencari
  Properti Pertama di Indonesia"), letting users buy, sell, and rent homes,
  shophouses (ruko), apartments, warehouses, offices, and land across Jakarta,
  Tangerang, and the wider Indonesian market via web and a companion mobile
  app. It was surfaced as a portfolio company of 500 Global (500 Startups) and
  added to the API Evangelist network as a lead for the enrichment pipeline.
  The enrichment pass found the company defunct: the pazpo.id domain no longer
  resolves (DNS lookup fails), and by 2024 the lapsed domain had been taken
  over by an unrelated Indonesian online-gambling ("togel") site. No live
  website, developer portal, API, SDK, or documentation surface exists to
  harvest; historical detail here is reconstructed from Internet Archive
  captures (2015-2017).
